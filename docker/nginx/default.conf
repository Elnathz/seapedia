server {
    listen 80;
    server_name seapedia.web.id www.seapedia.web.id;
    return 301 https://seapedia.web.id$request_uri;
}

server {
    listen 443 ssl;
    server_name seapedia.web.id www.seapedia.web.id;
    root /app/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/seapedia.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seapedia.web.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Serve user-uploaded storage files directly from the named volume
    location ^~ /storage/ {
        alias /app/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        # SCRIPT_FILENAME must resolve inside the app container filesystem
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|gif|ico|jpeg|jpg|png|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
